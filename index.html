<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNS Posting APP</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    
    <!-- Google API Client -->
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    
    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales/ko.js"></script>
    
    <!-- SheetJS (Excel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- PapaParse (CSV) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        /* Custom Styles */
        :root {
            --primary: #FF0000;
            --primary-hover: #CC0000;
            --sidebar-width: 240px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
        }
        
        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: white;
            border-right: 1px solid #e5e7eb;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .sidebar-logo {
            font-size: 20px;
            font-weight: 700;
            color: #111827;
        }
        
        .sidebar-nav {
            flex: 1;
            padding: 16px 12px;
            overflow-y: auto;
        }
        
        .nav-section {
            margin-bottom: 24px;
        }
        
        .nav-section-title {
            font-size: 11px;
            font-weight: 600;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 12px;
            margin-bottom: 8px;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            color: #4b5563;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .nav-item:hover {
            background: #f3f4f6;
            color: #111827;
        }
        
        .nav-item.active {
            background: #fee2e2;
            color: var(--primary);
        }
        
        .nav-item svg {
            width: 20px;
            height: 20px;
        }
        
        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid #e5e7eb;
        }
        
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e5e7eb;
            overflow: hidden;
        }
        
        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .user-info {
            flex: 1;
        }
        
        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: #111827;
        }
        
        .user-email {
            font-size: 12px;
            color: #6b7280;
        }
        
        /* Main Content */
        .main-content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
        }
        
        .page-header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
        }
        
        .page-subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-top: 4px;
        }
        
        .page-content {
            padding: 32px;
        }
        
        /* Cards */
        .card {
            background: white;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            padding: 24px;
        }
        
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 16px;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 32px;
        }
        
        .stat-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            padding: 24px;
        }
        
        .stat-label {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #111827;
        }
        
        .stat-suffix {
            font-size: 14px;
            color: #9ca3af;
            font-weight: 400;
        }
        
        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--primary-hover);
        }
        
        .btn-secondary {
            background: white;
            color: #374151;
            border: 1px solid #d1d5db;
        }
        
        .btn-secondary:hover {
            background: #f9fafb;
        }
        
        .btn-ghost {
            background: transparent;
            color: #6b7280;
        }
        
        .btn-ghost:hover {
            background: #f3f4f6;
            color: #111827;
        }
        
        /* Forms */
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }
        
        .form-label .required {
            color: var(--primary);
            margin-left: 2px;
        }
        
        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.1);
        }
        
        .form-textarea {
            resize: vertical;
            min-height: 120px;
        }
        
        /* Platform Toggle */
        .platform-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        
        .platform-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .platform-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .platform-icon.youtube {
            background: #fee2e2;
            color: #dc2626;
        }
        
        .platform-icon.instagram {
            background: #fce7f3;
            color: #db2777;
        }
        
        .platform-icon.threads {
            background: #f3f4f6;
            color: #111827;
        }
        
        .platform-icon.tiktok {
            background: #f3e8ff;
            color: #9333ea;
        }
        
        .platform-name {
            font-weight: 600;
            color: #111827;
        }
        
        .platform-status {
            font-size: 12px;
            color: #6b7280;
        }
        
        /* Toggle Switch */
        .toggle {
            position: relative;
            width: 48px;
            height: 24px;
        }
        
        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #d1d5db;
            border-radius: 24px;
            transition: 0.3s;
        }
        
        .toggle-slider:before {
            content: "";
            position: absolute;
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }
        
        .toggle input:checked + .toggle-slider {
            background: var(--primary);
        }
        
        .toggle input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }
        
        /* Content Type Selector */
        .content-type-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .content-type-card {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .content-type-card:hover {
            border-color: #d1d5db;
        }
        
        .content-type-card.selected {
            border-color: var(--primary);
            background: #fef2f2;
        }
        
        .content-type-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px;
            color: #6b7280;
        }
        
        .content-type-card.selected .content-type-icon {
            color: var(--primary);
        }
        
        .content-type-label {
            font-weight: 600;
            color: #374151;
        }
        
        /* File Upload */
        .file-upload-zone {
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            padding: 48px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .file-upload-zone:hover {
            border-color: var(--primary);
            background: #fef2f2;
        }
        
        .file-upload-zone.has-file {
            border-color: #22c55e;
            background: #f0fdf4;
        }
        
        /* Preview Panel */
        .preview-panel {
            position: sticky;
            top: 24px;
            background: white;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            padding: 24px;
        }
        
        .preview-title {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 16px;
        }
        
        /* Login Page */
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 48px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        .login-logo {
            font-size: 28px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
        }
        
        .login-subtitle {
            color: #6b7280;
            margin-bottom: 32px;
        }
        
        .google-login-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: white;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .google-login-btn:hover {
            background: #f9fafb;
            border-color: #9ca3af;
        }
        
        /* Loading Spinner */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e7eb;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Toast Notification */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .toast {
            background: white;
            border-radius: 8px;
            padding: 16px 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .toast.success {
            border-left: 4px solid #22c55e;
        }
        
        .toast.error {
            border-left: 4px solid #ef4444;
        }
        
        /* Utility Classes */
        .hidden {
            display: none !important;
        }
        
        .text-center {
            text-align: center;
        }
        
        .mt-4 {
            margin-top: 16px;
        }
        
        .mb-4 {
            margin-bottom: 16px;
        }
        
        .flex {
            display: flex;
        }
        
        .items-center {
            align-items: center;
        }
        
        .justify-between {
            justify-content: space-between;
        }
        
        .gap-4 {
            gap: 16px;
        }
        
        .w-full {
            width: 100%;
        }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- App Container -->
    <div id="app"></div>
    
    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const CONFIG = {
            // Firebase Configuration
            FIREBASE: {
                apiKey: "AIzaSyCXF0W4DMkVBvBtat_OxDO1O8M5rCMIMVE",
                authDomain: "sns-posting-app.firebaseapp.com",
                projectId: "sns-posting-app",
                storageBucket: "sns-posting-app.firebasestorage.app",
                messagingSenderId: "613245242749",
                appId: "1:613245242749:web:e38c5ae988246094c29014"
            },
            
            // Google OAuth Configuration
            GOOGLE: {
                CLIENT_ID: "613245242749-iprnqdumpqni8rgsgfh77lgceitecom1.apps.googleusercontent.com",
                API_KEY: "AIzaSyCXF0W4DMkVBvBtat_OxDO1O8M5rCMIMVE",
                SCOPES: [
                    'https://www.googleapis.com/auth/youtube.upload',
                    'https://www.googleapis.com/auth/youtube.readonly',
                    'https://www.googleapis.com/auth/youtube.force-ssl'
                ]
            },
            
            // App Settings
            APP_NAME: 'SNS Posting APP',
            MAX_FILE_SIZE: 2 * 1024 * 1024 * 1024, // 2GB for YouTube
            SUPPORTED_VIDEO_TYPES: ['video/mp4', 'video/quicktime', 'video/x-msvideo'],
            SUPPORTED_IMAGE_TYPES: ['image/jpeg', 'image/png', 'image/gif']
        };

        // ============================================
        // GLOBAL STATE
        // ============================================
        const STATE = {
            user: null,
            isAuthenticated: false,
            currentPage: 'dashboard',
            platforms: {
                youtube: { connected: false, data: null },
                instagram: { connected: false, data: null },
                threads: { connected: false, data: null },
                tiktok: { connected: false, data: null }
            },
            draft: {
                type: null,
                media: null,
                title: '',
                description: '',
                pinnedComment: '',
                platforms: {},
                scheduledAt: null
            },
            stats: {
                monthlyPosts: 0,
                connectedPlatforms: 0,
                scheduledPosts: 0
            }
        };

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        const UTILS = {
            formatDate: (timestamp) => {
                if (!timestamp) return '-';
                const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
                return date.toLocaleDateString('ko-KR', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            },
            
            formatDateTime: (timestamp) => {
                if (!timestamp) return '-';
                const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
                return date.toLocaleString('ko-KR', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            },
            
            formatNumber: (num) => {
                if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
                if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
                return num.toString();
            },
            
            formatFileSize: (bytes) => {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            },
            
            generateId: () => {
                return Date.now().toString(36) + Math.random().toString(36).substr(2);
            },
            
            debounce: (func, wait) => {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            }
        };

        // ============================================
        // TOAST NOTIFICATIONS
        // ============================================
        const Toast = {
            show: (message, type = 'info') => {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        ${type === 'success' 
                            ? '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>'
                            : type === 'error'
                            ? '<circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>'
                            : '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>'
                        }
                    </svg>
                    <span>${message}</span>
                `;
                container.appendChild(toast);
                
                setTimeout(() => {
                    toast.style.animation = 'slideIn 0.3s ease reverse';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            },
            
            success: (message) => Toast.show(message, 'success'),
            error: (message) => Toast.show(message, 'error'),
            info: (message) => Toast.show(message, 'info')
        };

        // ============================================
        // FIREBASE INITIALIZATION
        // ============================================
        let firebaseApp, firebaseAuth, firebaseDb;

        const initFirebase = () => {
            firebaseApp = firebase.initializeApp(CONFIG.FIREBASE);
            firebaseAuth = firebase.auth();
            firebaseDb = firebase.firestore();
        };

        // ============================================
        // AUTHENTICATION
        // ============================================
        const AUTH = {
            init: () => {
                firebaseAuth.onAuthStateChanged((user) => {
                    if (user) {
                        STATE.user = user;
                        STATE.isAuthenticated = true;
                        APP.loadUserData().then(() => {
                            APP.render();
                        });
                    } else {
                        STATE.user = null;
                        STATE.isAuthenticated = false;
                        APP.renderLogin();
                    }
                });
            },
            
            signInWithGoogle: async () => {
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    provider.addScope('https://www.googleapis.com/auth/youtube.upload');
                    provider.addScope('https://www.googleapis.com/auth/youtube.readonly');
                    
                    const result = await firebaseAuth.signInWithPopup(provider);
                    
                    // Get Google Access Token for YouTube API
                    const credential = result.credential;
                    const accessToken = credential.accessToken;
                    
                    // Save token to Firestore
                    await firebaseDb.collection('users').doc(result.user.uid).collection('tokens').doc('youtube').set({
                        accessToken: accessToken,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    Toast.success('로그인 성공!');
                    return result.user;
                } catch (error) {
                    console.error('Login error:', error);
                    Toast.error('로그인 실패: ' + error.message);
                    throw error;
                }
            },
            
            signOut: async () => {
                try {
                    await firebaseAuth.signOut();
                    Toast.success('로그아웃되었습니다.');
                } catch (error) {
                    Toast.error('로그아웃 실패: ' + error.message);
                }
            }
        };

        // ============================================
        // DATABASE OPERATIONS
        // ============================================
        const DB = {
            // User Profile
            getUserProfile: async (userId) => {
                const doc = await firebaseDb.collection('users').doc(userId).get();
                return doc.exists ? doc.data() : null;
            },
            
            saveUserProfile: async (userId, data) => {
                await firebaseDb.collection('users').doc(userId).set({
                    ...data,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            },
            
            // Platforms
            getPlatforms: async (userId) => {
                const snapshot = await firebaseDb.collection('users').doc(userId).collection('platforms').get();
                const platforms = {};
                snapshot.forEach(doc => {
                    platforms[doc.id] = doc.data();
                });
                return platforms;
            },
            
            savePlatform: async (userId, platformId, data) => {
                await firebaseDb.collection('users').doc(userId).collection('platforms').doc(platformId).set({
                    ...data,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            },
            
            // Posts
            createPost: async (userId, data) => {
                const postRef = firebaseDb.collection('users').doc(userId).collection('posts').doc();
                await postRef.set({
                    ...data,
                    id: postRef.id,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                return postRef.id;
            },
            
            getPosts: async (userId, filters = {}) => {
                let query = firebaseDb.collection('users').doc(userId).collection('posts').orderBy('createdAt', 'desc');
                
                if (filters.status) {
                    query = query.where('status', '==', filters.status);
                }
                
                const snapshot = await query.limit(50).get();
                return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            },
            
            // Stats
            getMonthlyStats: async (userId) => {
                const now = new Date();
                const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
                
                const snapshot = await firebaseDb.collection('users').doc(userId).collection('posts')
                    .where('createdAt', '>=', startOfMonth)
                    .where('status', '==', 'published')
                    .get();
                
                return snapshot.size;
            },
            
            // Drafts
            saveDraft: async (userId, draftData) => {
                const draftRef = firebaseDb.collection('users').doc(userId).collection('drafts').doc('current');
                await draftRef.set({
                    ...draftData,
                    savedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            },
            
            getDraft: async (userId) => {
                const doc = await firebaseDb.collection('users').doc(userId).collection('drafts').doc('current').get();
                return doc.exists ? doc.data() : null;
            },
            
            // Pinned Comments
            getPinnedComments: async (userId) => {
                const snapshot = await firebaseDb.collection('users').doc(userId).collection('pinnedComments')
                    .orderBy('lastUsedAt', 'desc')
                    .limit(20)
                    .get();
                return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            },
            
            savePinnedComment: async (userId, text) => {
                const commentRef = firebaseDb.collection('users').doc(userId).collection('pinnedComments').doc();
                await commentRef.set({
                    text: text,
                    usageCount: 1,
                    lastUsedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                return commentRef.id;
            },
            
            incrementCommentUsage: async (userId, commentId) => {
                await firebaseDb.collection('users').doc(userId).collection('pinnedComments').doc(commentId).update({
                    usageCount: firebase.firestore.FieldValue.increment(1),
                    lastUsedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }

        // ============================================

        const APP = {
            init: () => {
                initFirebase();
                AUTH.init();
            },

            loadUserData: async () => {
                if (!STATE.user) return;
                
                try {
                    // Load platforms
                    const platforms = await DB.getPlatforms(STATE.user.uid);
                    STATE.platforms = { ...STATE.platforms, ...platforms };
                    
                    // Calculate stats
                    STATE.stats.connectedPlatforms = Object.values(STATE.platforms).filter(p => p.connected).length;
                    STATE.stats.monthlyPosts = await DB.getMonthlyStats(STATE.user.uid);
                    
                    // Load draft
                    const draft = await DB.getDraft(STATE.user.uid);
                    if (draft) {
                        STATE.draft = { ...STATE.draft, ...draft };
                    }
                } catch (error) {
                    console.error('Error loading user data:', error);
                }
            },

            render: () => {
                const app = document.getElementById('app');
                
                if (!STATE.isAuthenticated) {
                    app.innerHTML = UI.renderLogin();
                    return;
                }

                const pageContent = APP.getPageContent();
                
                app.innerHTML = `
                    ${UI.renderSidebar()}
                    <main class="main-content">
                        ${pageContent}
                    </main>
                `;

                // Initialize calendar if on calendar page
                if (STATE.currentPage === 'calendar') {
                    APP.initCalendar();
                }
            },

            renderLogin: () => {
                document.getElementById('app').innerHTML = UI.renderLogin();
            },

            getPageContent: () => {
                switch (STATE.currentPage) {
                    case 'dashboard': return UI.renderDashboard();
                    case 'publish': return UI.renderPublish();
                    case 'csv': return UI.renderCsvUpload();
                    case 'calendar': return UI.renderCalendar();
                    case 'history': return UI.renderHistory();
                    case 'platforms': return UI.renderPlatforms();
                    case 'subscription': return UI.renderSubscription();
                    case 'users': return UI.renderUsers();
                    default: return UI.renderDashboard();
                }
            },

            navigateTo: (page) => {
                STATE.currentPage = page;
                window.location.hash = page;
                APP.render();
            },

            // Content Type Selection
            selectContentType: (type) => {
                STATE.draft.type = type;
                APP.render();
            },

            // File Handling
            handleFileSelect: (event) => {
                const file = event.target.files[0];
                if (!file) return;

                // Validate file size
                if (file.size > CONFIG.MAX_FILE_SIZE) {
                    Toast.error('파일 크기가 너무 큽니다. (최대 2GB)');
                    return;
                }

                // Validate file type
                const validTypes = STATE.draft.type === 'video' 
                    ? CONFIG.SUPPORTED_VIDEO_TYPES 
                    : CONFIG.SUPPORTED_IMAGE_TYPES;
                
                if (!validTypes.includes(file.type)) {
                    Toast.error('지원하지 않는 파일 형식입니다.');
                    return;
                }

                STATE.draft.media = {
                    name: file.name,
                    size: file.size,
                    type: file.type,
                    file: file
                };

                APP.render();
                Toast.success('파일이 선택되었습니다.');
            },

            // Platform Toggle
            togglePlatform: (platform, enabled) => {
                STATE.draft.platforms[platform] = enabled;
            },

            // Save Draft
            saveDraft: async () => {
                if (!STATE.user) return;
                
                try {
                    await DB.saveDraft(STATE.user.uid, STATE.draft);
                    Toast.success('임시 저장되었습니다.');
                } catch (error) {
                    Toast.error('저장 실패: ' + error.message);
                }
            },

            // Publish Now
            publishNow: async () => {
                if (!APP.validatePublishForm()) return;
                
                try {
                    const postId = await DB.createPost(STATE.user.uid, {
                        ...STATE.draft,
                        status: 'publishing',
                        scheduledAt: null
                    });
                    
                    Toast.success('발행이 시작되었습니다.');
                    APP.navigateTo('history');
                } catch (error) {
                    Toast.error('발행 실패: ' + error.message);
                }
            },

            // Schedule Publish
            schedulePublish: () => {
                if (!APP.validatePublishForm()) return;
                
                // Show date picker modal (simplified for now)
                const scheduledAt = prompt('예약 날짜와 시간을 입력하세요 (YYYY-MM-DD HH:MM):');
                if (!scheduledAt) return;
                
                const date = new Date(scheduledAt);
                if (isNaN(date.getTime())) {
                    Toast.error('올바른 날짜 형식이 아닙니다.');
                    return;
                }
                
                STATE.draft.scheduledAt = date;
                APP.saveDraft();
                Toast.success('예약 발행이 저장되었습니다.');
            },

            // Validate Form
            validatePublishForm: () => {
                if (!STATE.draft.title.trim()) {
                    Toast.error('제목을 입력해주세요.');
                    return false;
                }
                if (!STATE.draft.description.trim()) {
                    Toast.error('설명을 입력해주세요.');
                    return false;
                }
                if (STATE.draft.type !== 'text' && !STATE.draft.media) {
                    Toast.error('파일을 선택해주세요.');
                    return false;
                }
                const selectedPlatforms = Object.values(STATE.draft.platforms).filter(Boolean);
                if (selectedPlatforms.length === 0) {
                    Toast.error('최소 하나의 플랫폼을 선택해주세요.');
                    return false;
                }
                return true;
            },

            // Pinned Comment Modal
            openPinnedCommentModal: () => {
                // Simplified - would show modal with history
                const comment = prompt('고정댓글을 입력하세요:');
                if (comment) {
                    STATE.draft.pinnedComment = comment;
                    document.getElementById('pinnedComment').value = comment;
                }
            },

            // CSV Upload
            handleCsvSelect: (event) => {
                const file = event.target.files[0];
                if (!file) return;

                Papa.parse(file, {
                    header: true,
                    complete: (results) => {
                        console.log('CSV parsed:', results.data);
                        Toast.success(`${results.data.length}개의 항목이 업로드되었습니다.`);
                    },
                    error: (error) => {
                        Toast.error('CSV 파싱 오류: ' + error.message);
                    }
                });
            },

            downloadCsvTemplate: () => {
                const csv = 'title,description,type,platform,date,hashtags,media\n' +
                           '예시 제목,예시 설명,VIDEO,YOUTUBE,2024-04-07 15:00,#예시,https://drive.google.com/...';
                
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'sns-posting-template.csv';
                link.click();
                
                Toast.success('템플릿이 다운로드되었습니다.');
            },

            // Calendar
            initCalendar: () => {
                const calendarEl = document.getElementById('calendar');
                if (!calendarEl) return;

                const calendar = new FullCalendar.Calendar(calendarEl, {
                    locale: 'ko',
                    initialView: 'dayGridMonth',
                    headerToolbar: {
                        left: 'prev,next today',
                        center: 'title',
                        right: 'dayGridMonth,timeGridWeek'
                    },
                    events: [
                        // Sample events - would be loaded from DB
                    ]
                });

                calendar.render();
            },

            // History
            refreshHistory: () => {
                Toast.success('히스토리를 새로고침했습니다.');
            },

            // Platform Connections
            connectYouTube: async () => {
                try {
                    // Re-authenticate with YouTube scopes
                    const provider = new firebase.auth.GoogleAuthProvider();
                    provider.addScope('https://www.googleapis.com/auth/youtube.upload');
                    provider.addScope('https://www.googleapis.com/auth/youtube.readonly');
                    
                    const result = await firebase.auth().currentUser.linkWithPopup(provider);
                    
                    // Save platform info
                    await DB.savePlatform(STATE.user.uid, 'youtube', {
                        connected: true,
                        channelTitle: result.user.displayName,
                        connectedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    STATE.platforms.youtube = {
                        connected: true,
                        data: { channelTitle: result.user.displayName }
                    };
                    
                    Toast.success('YouTube가 연결되었습니다.');
                    APP.render();
                } catch (error) {
                    Toast.error('연결 실패: ' + error.message);
                }
            },

            connectInstagram: () => {
                Toast.info('Instagram 연동은 준비 중입니다.');
            },

            disconnectPlatform: async (platform) => {
                if (!confirm('정말 연결을 해제하시겠습니까?')) return;
                
                try {
                    await DB.savePlatform(STATE.user.uid, platform, {
                        connected: false,
                        disconnectedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    STATE.platforms[platform] = { connected: false, data: null };
                    Toast.success('연결이 해제되었습니다.');
                    APP.render();
                } catch (error) {
                    Toast.error('해제 실패: ' + error.message);
                }
            }
        };

        // ============================================
        // ROUTING
        // ============================================
        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.replace('#', '') || 'dashboard';
            STATE.currentPage = hash;
            APP.render();
        });

        // ============================================
        // INITIALIZE
        // ============================================
        document.addEventListener('DOMContentLoaded', APP.init);
    </script>
</body>
</html>
